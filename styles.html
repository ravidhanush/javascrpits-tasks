<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    function displayText(){
        var myText=document.getElementById("aha").innerText
        console.log(myText);
    }
    </script>
</head>
<body>
    <h1>Inner Text Example</h1>
    <p id="aha">Mahiii</p>
    <button onclick="displayText()">Text</button>
    
</body>
</html>
